name: Build TikTok You iOS Tweak & IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct URL to clean decrypted TikTok.ipa'
        required: false
        default: 'https://github.com/khoald333/tiktok-ipa/releases/download/v40.2.1/TikTok-40.2.1.ipa'

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          brew install dpkg ldid
          git clone https://github.com/Tyilo/insert_dylib /tmp/insert_dylib
          cd /tmp/insert_dylib && xcodebuild -configuration Release
          sudo cp build/Release/insert_dylib /usr/local/bin/ || sudo cp build/Release/insert_dylib /opt/homebrew/bin/ || true

      - name: Set up Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ${{ github.workspace }}/theos
          mkdir -p ${{ github.workspace }}/theos/sdks
          echo "Downloading official patched iPhoneOS 16.5 SDK..."
          curl -fsSL https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz -o /tmp/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C ${{ github.workspace }}/theos/sdks/
          ls -la ${{ github.workspace }}/theos/sdks/
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Compile Tweak (.deb & .dylib)
        run: |
          set -o pipefail
          export THEOS=${{ github.workspace }}/theos
          export PATH="/opt/homebrew/bin:/usr/local/bin:$THEOS/bin:$PATH"
          make clean
          make package FINALPACKAGE=1 messages=yes 2>&1 | tee /tmp/make.log || {
            echo "## ❌ Compile Error Log:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 80 /tmp/make.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 2
          }
        working-directory: ${{ github.workspace }}/BHTikTokPlusPlus

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Log
          path: /tmp/make.log

      - name: Upload .deb and .dylib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TikTokYou-iOS-Build
          path: |
            BHTikTokPlusPlus/packages/*.deb
            BHTikTokPlusPlus/.theos/obj/debug/*.dylib
            BHTikTokPlusPlus/.theos/obj/*.dylib

      - name: Inject Tweak into TikTok IPA
        run: |
          git clone https://github.com/Al4ise/Azule /tmp/Azule
          chmod +x /tmp/Azule/azule
          export PATH="/opt/homebrew/bin:/usr/local/bin:/tmp/Azule:$PATH"
          IPA_LINK="${{ github.event.inputs.ipa_url }}"
          if [ -z "$IPA_LINK" ]; then
            IPA_LINK="https://github.com/khoald333/tiktok-ipa/releases/download/v40.2.1/TikTok-40.2.1.ipa"
          fi
          echo "Downloading base IPA from $IPA_LINK..."
          curl -L -o /tmp/TikTok_clean.ipa "$IPA_LINK"
          DEB_FILE=$(ls ${{ github.workspace }}/BHTikTokPlusPlus/packages/*.deb | head -n 1)
          echo "Found DEB: $DEB_FILE"
          mkdir -p ${{ github.workspace }}/output
          echo "Injecting $DEB_FILE into TikTok IPA using Azule..."
          /tmp/Azule/azule -i /tmp/TikTok_clean.ipa -o ${{ github.workspace }}/output -n TikTok_You_4.2 -f "$DEB_FILE" -u -U -v
          ls -la ${{ github.workspace }}/output/

      - name: Upload Injected TikTok You IPA
        uses: actions/upload-artifact@v4
        with:
          name: TikTok-You-iOS-IPA
          path: ${{ github.workspace }}/output/*.ipa
